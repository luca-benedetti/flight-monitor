[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flight-monitor"
version = "0.1.0"
description = "Find round-trip flight combinations between Brussels (BRU) and Venice (VCE) with configurable constraints"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Luca Benedetti", email = "luca@example.com"}
]
keywords = ["flights", "travel", "brussels", "venice", "price-tracker"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]

dependencies = [
    "fast-flights==3.1.0",
    "playwright>=1.60.0",
    "requests>=2.28.0",
    "typing-extensions>=4.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
build-fares = "flight_monitor.build_fares:main"
fetch-flights = "flight_monitor.fetch_flights:main"
generate-mock-flights = "flight_monitor.generate_mock_flights:main"
find-round-trips = "flight_monitor.find_round_trips:main"
scrape-flights = "flight_monitor.scrape_flights:main"
validate-flight-model = "flight_monitor.flight_model:main"

[project.urls]
Homepage = "https://github.com/luca-benedetti/flight-monitor"
Repository = "https://github.com/luca-benedetti/flight-monitor"
Issues = "https://github.com/luca-benedetti/flight-monitor/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["flight_monitor*"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
